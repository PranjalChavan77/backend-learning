<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add home to Airbnb</title>
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Register Your Home</h1>

      <form action="/host/add-home" method="POST" class="space-y-4">
        <input
          type="text"
          name="houseName"
          placeholder="Enter home name"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
        />

        <button
          type="submit"
          class="w-full bg-pink-500 text-white py-3 rounded-lg hover:bg-pink-600 transition"
        >
          Submit
        </button>
      </form>
    </div>
  </body>
</html>
